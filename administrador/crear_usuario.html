<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Usuario - Dashboard Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    
    <nav class="navbar navbar-dark bg-dark">

        <div class="container">
            
            <a class="navbar-brand" href="dashboard_admin.html">Panel Administrador</a>
            
            <button onclick="window.location.href='dashboard_admin.html'" class="btn btn-secondary">

                Volver

            </button>
        </div>
    </nav>

    <div class="container mt-5">
        
        <h2 class="text-center mb-4">Crear Nuevo Usuario</h2>
        
        <div class="card p-4 shadow" style="max-width:500px; margin:auto;">
            
            <form id="crearUsuarioForm">
                
                <div class="mb-3">

                    <label class="form-label">Nombre</label>

                    <input type="text" id="nombre" class="form-control" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Correo</label>

                    <input type="email" id="correo" class="form-control" required>

                </div>
                
                <div class="mb-3">

                    <label class="form-label">Contraseña</label>

                    <input type="password" id="password" class="form-control" required>

                </div>
                
                <button type="submit" class="btn btn-success w-100">

                    Crear Usuario

                </button>
            </form>
        </div>
    </div>

    <script src="../js/script_crud_admin.js"></script>

    <script>
        
        const form = document.getElementById("crearUsuarioForm");
        form.addEventListener("submit", crearUsuario);
        
    </script>

</body>
</html>
