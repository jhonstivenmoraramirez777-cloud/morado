<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    
    <h2 class="text-center mt-4 mb-4">Editar Usuario</h2>

    <div class="container">

        <div class="card shadow p-4" style="max-width:500px; margin:auto;">
            
            <form onsubmit="guardarUsuarioEditado(event)">
                
                <div class="mb-3">

                    <label>ID</label>
                    <input type="text" id="idUsuario" class="form-control" readonly>

                </div>
                
                <div class="mb-3">

                    <label>Nombre</label>
                    <input type="text" id="nombreUsuario" class="form-control" required>

                </div>
                
                <div class="mb-3">

                    <label>Correo</label>
                    <input type="email" id="correoUsuario" class="form-control" required>

                </div>
                
                <div class="mb-3">

                    <label>Nueva contraseña (opcional)</label>
                    <input type="password" id="passwordUsuario" class="form-control" placeholder="Dejar en blanco para no cambiarla">

                </div>
                
                <button type="submit" class="btn btn-success w-100">

                    Guardar cambios

                </button>
            </form>
        </div>
    </div>

    <script src="../js/script_crud_admin.js"></script>

    <script>
        
        window.onload = cargarUsuarioEditar;
        
    </script>

</body>
</html>
